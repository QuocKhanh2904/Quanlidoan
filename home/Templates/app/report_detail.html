{% extends 'app/base.html' %}
{% load static %}

{% block report_detail %}
<link rel="stylesheet" href="{% static 'app/css/report_detail.css' %}">
<div class="container">
    <h1>BÁO CÁO TIẾN ĐỘ</h1>

    <div class="form-group">
        <label><i class="icon book"></i> Tên đề tài</label>
        <div class="readonly-field">Tech Innovators</div>
    </div>

    <div class="form-group">
        <label><i class="icon progress"></i> Giai đoạn 1</label>
        <div class="progress-bar">
            <div class="progress-fill" style="width: 5%; background-color: red;"></div>
        </div>
    </div>

    <div class="form-group file-upload">
        <label><i class="icon file"></i> File báo cáo <span class="required">*</span></label>
        <div class="file-row">
            <input type="file" id="fileInput">
            <input type="text" value="Báo cáo giai đoạn 1.docx" readonly>
            <input type="text" placeholder="Tên file hiển thị">
            <button class="secondary">XEM LỊCH SỬ</button>
        </div>
    </div>

    <div class="form-group">
        <label><i class="icon note"></i> Nội dung <span class="required">*</span></label>
        <textarea placeholder="Nội dung báo cáo..."></textarea>
    </div>

    <div class="form-actions">
        <button class="secondary">THOÁT</button>
        <button class="primary">GỬI</button>
    </div>
</div>
{% endblock report_detail %}
