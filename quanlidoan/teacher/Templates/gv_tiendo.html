<!-- Form thêm mốc tiến độ -->
<div class="card mb-3">
  <div class="card-body">
    <form action="{% url 'gv_them_tiendo' doan.mada %}" method="post" class="row g-2 align-items-end">
      {% csrf_token %}
      <div class="col-md-8">
        <label class="form-label">Mô tả công việc</label>
        <input type="text" name="mota" class="form-control" placeholder="VD: Hoàn thiện module A" maxlength="255">
      </div>
      <div class="col-md-4">
        <label class="form-label">% hoàn thành</label>
        <input type="number" name="phantram" class="form-control" min="0" max="100" step="1" value="0">
      </div>
      <div class="col-12">
        <button class="btn btn-primary">+ Thêm mốc</button>
      </div>
    </form>
  </div>
</div>

<!-- Timeline tiến độ -->
<div class="card">
  <div class="card-header"><strong>Nhật ký tiến độ</strong></div>
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th width="160">Thời gian</th>
          <th>Mô tả</th>
          <th width="140" class="text-end">% hoàn thành</th>
        </tr>
      </thead>
      <tbody>
        {% for t in tiendos %}
        <tr>
          <td>{{ t.ngaycapnhat|date:"Y-m-d H:i" }}</td>
          <td>{{ t.motacongviec|default:"-" }}</td>
          <td class="text-end fw-semibold">{{ t.tiendophantram|floatformat:0 }}%</td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center text-muted py-4">Chưa có mốc tiến độ nào.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
