{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="mb-3">Đăng nhập</h5>
            {% if form.errors %}
              <div class="alert alert-danger">Tài khoản hoặc mật khẩu không đúng.</div>
            {% endif %}
            <form method="post" action="{% url 'login' %}">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">Tài khoản</label>
                {{ form.username|add_class:"form-control" }}
              </div>
              <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                {{ form.password|add_class:"form-control" }}
              </div>
              <button class="btn btn-success w-100">Đăng nhập</button>
            </form>
            <div class="mt-3 text-center">
              <a href="{% url 'password_reset' %}">Quên mật khẩu?</a>
            </div>
          </div>
        </div>
        <div class="text-center mt-3">
          <a class="btn btn-link" href="{% url 'teacher_home' %}">← Về trang chủ</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
