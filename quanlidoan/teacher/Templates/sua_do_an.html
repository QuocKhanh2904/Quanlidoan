{% extends "teacher.html" %}
{% load static %}
{% block danh_sach_do_an %}
<link rel="stylesheet" href="{% static 'app/css/doan.css' %}">

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>✏️ Sửa đồ án #{{ doan.mada }}</h4>
    <a class="btn btn-secondary" href="{% url 'danh_sach_do_an' %}">← Quay lại</a>
  </div>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post" class="card p-3 shadow-sm">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Tên đồ án <span class="text-danger">*</span></label>
        <input type="text" name="tenda" class="form-control" required value="{{ doan.tenda }}">
      </div>

      <div class="col-md-4">
        <label class="form-label">Lĩnh vực</label>
        <input type="text" name="linhvuc" class="form-control" value="{{ doan.linhvuc }}">
      </div>

      <div class="col-md-4">
        <label class="form-label">Số lượng tối đa</label>
        <input type="number" min="1" name="soluong" class="form-control" value="{{ doan.soluong }}">
      </div>

      <div class="col-md-4">
        <label class="form-label">Ngày bắt đầu</label>
        <input type="date" name="ngaybd" class="form-control"
               value="{{ doan.ngaybd|date:'Y-m-d' }}">
      </div>

      <div class="col-md-4">
        <label class="form-label">Ngày kết thúc</label>
        <input type="date" name="ngaykt" class="form-control"
               value="{{ doan.ngaykt|date:'Y-m-d' }}">
      </div>

      <div class="col-12">
        <label class="form-label">Mô tả</label>
        <textarea name="mota" rows="4" class="form-control">{{ doan.mota }}</textarea>
      </div>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary">Lưu thay đổi</button>
      <a href="{% url 'danh_sach_do_an' %}" class="btn btn-outline-secondary">Hủy</a>
    </div>
  </form>
</div>
{% endblock %}
