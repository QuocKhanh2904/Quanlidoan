{% extends "teacher.html" %} {% load static %} {% block danh_sach_do_an %}
<link rel="stylesheet" href="{% static 'app/css/doan.css' %}" />

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>📄 Thêm đồ án mới</h4>
    <a class="btn btn-secondary" href="{% url 'danh_sach_do_an' %}"
      >← Quay lại danh sách đồ án</a
    >
  </div>

  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post" class="card p-3 shadow-sm">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-12">
        <label class="form-label fw-bold"
          >Tên đồ án <span class="text-danger">*</span></label
        >
        <input
          type="text"
          name="tenda"
          class="form-control"
          placeholder="Nhập tên đồ án..."
          required
          value="{{ form.tenda|default_if_none:'' }}"
        />
      </div>

      <div class="col-md-12">
        <label class="form-label fw-bold">Lĩnh vực</label>
        <input
          type="text"
          name="linhvuc"
          class="form-control"
          placeholder="VD: Web, AI, IoT..."
          value="{{ form.linhvuc|default_if_none:'' }}"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label fw-bold">Số lượng tối đa</label>
        <input
          type="number"
          min="1"
          name="soluong"
          class="form-control"
          placeholder="VD: 2"
          value="{{ form.soluong|default_if_none:'' }}"
        />
      </div> 

      <div class="col-md-4">
        <label class="form-label fw-bold">Ngày bắt đầu</label>
        <input
          type="date"
          name="ngaybd"
          class="form-control"
          value="{{ form.ngaybd|default_if_none:'' }}"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label fw-bold">Ngày kết thúc</label>
        <input
          type="date"
          name="ngaykt"
          class="form-control"
          value="{{ form.ngaykt|default_if_none:'' }}"
        />
      </div>

      <div class="col-12">
        <label class="form-label fw-bold">Mô tả</label>
        <textarea
          name="mota"
          rows="4"
          class="form-control"
          placeholder="Mô tả ngắn về nội dung và yêu cầu đồ án..."
        >
{{ form.mota|default_if_none:'' }}</textarea
        >
      </div>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-success">💾 Lưu đồ án</button>
      <a href="{% url 'danh_sach_do_an' %}" class="btn btn-outline-secondary"
        >Hủy</a
      >
    </div>
  </form>

  <small class="text-muted d-block mt-3">
    * Mã giảng viên và ngày gửi sẽ được hệ thống tự động điền.
  </small>
</div>
{% endblock %}
